{% extends 'htmlfile/layouts/main.html' %}

{% block title %}
    Login page
{% endblock title %}

{% block content %}
<style>
    body {
        background-color: #f8f9fa;
        font-family: Arial, sans-serif;
    }

    #con {
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 2px 10px rgba(236, 3, 217, 0.859);
        padding: 30px;
        margin-top: 70px;
        margin-bottom: 40px;
    }

    #con h4 {
        color: #343a40;
    }

    #con hr {
        margin: 20px 0;
    }

    #con .form-label {
        font-weight: bold;
    }

    #con .form-control {
        border: 1px solid #ced4da;
        border-radius: 5px;
        transition: border-color 0.2s;
    }

    #con .form-control:focus {
        border-color: #007bff;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }

    #con .btn-primary {
        background-color: #007bff;
        border: none;
        border-radius: 5px;
        padding: 10px 15px;
        transition: background-color 0.3s;
    }

    #con .btn-primary:hover {
        background-color: #0056b3;
    }

    #con .text-center p {
        margin: 10px 0 0;
    }
</style>

<div class="container" id="con" style="min-height: 550px;">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-12">
            <h4 class="mb-4 text-center">User Login</h4>
            <hr style="border-color: #b8bfc2;">
            {% include 'htmlfile/include/message.html' %}
            <section class="py-4">
                <form method="post" action="">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" name="username" id="username" class="form-control" placeholder="Enter User Name" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" name="password" id="password" class="form-control" placeholder="Enter Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <div class="text-center mt-3">
                    <p>new register! <a href="{% url 'register' %}">Register now</a></p>
                </div>
            </section>
        </div>
    </div>
</div>
{% endblock content %}
